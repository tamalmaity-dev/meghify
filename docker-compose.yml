# The panel ships as the control plane service. The reverse proxy is NOT part
# of the compose file: the panel deploys and owns `meghify-proxy` itself (with
# the file-provider dynamic routing described in docs/deployments.md), exactly
# as it does on systemd installs, so domain routing follows one code path no
# matter how the panel runs. Remove-then-recreate of that proxy is harmless:
# certificates and routing files live in named volumes.

services:
  meghify:
    image: ghcr.io/tamalmaity-dev/meghify:${VERSION:-dev}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    # The panel talks to the Docker Engine on this host, which is what lets it
    # manage containers. It is the same privilege boundary Coolify uses.
    volumes:
      # The panel needs write access to the engine API; mounting the socket
      # read-only only prevents modifying the socket file and has never made
      # the Docker API read-only.
      - /var/run/docker.sock:/var/run/docker.sock
      - meghify-data:/data
    # The panel runs as distroless "nonroot" (65532). It must join the host
    # group that owns /var/run/docker.sock or every engine call fails with
    # EACCES. Set DOCKER_GID=$(stat -c '%g' /var/run/docker.sock) in .env.
    group_add:
      - "${DOCKER_GID:?DOCKER_GID must be the host docker socket group}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      PANEL_ADDR: ":8080"
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_DRIVER: ${DB_DRIVER:-sqlite}
      DATA_DIR: /data
      # Required in production. Generate with: openssl rand -hex 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      DOCKER_HOST: unix:///var/run/docker.sock
      SESSION_TTL: ${SESSION_TTL:-720h}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      METRICS_RETENTION_DAYS: ${METRICS_RETENTION_DAYS:-14}
      REGISTRY_URL: ${REGISTRY_URL:-}
      REGISTRY_USER: ${REGISTRY_USER:-}
      REGISTRY_PASS: ${REGISTRY_PASS:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks: [meghify]
    # No healthcheck is needed for the panel itself: the entrypoint is the
    # API, which exposes /api/health for an external check.
    security_opt:
      - no-new-privileges:true

volumes:
  meghify-data:

networks:
  meghify:
    name: meghify
